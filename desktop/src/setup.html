<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; script-src 'unsafe-inline'" />
    <title>Connect to Tsushin</title>
    <style>
      :root {
        --ink: #0b0f14;
        --indigo: #3c5afe;
        --slate: #5b6674;
        --fog: #f6f7f9;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        place-items: center;
        background: var(--ink);
        color: var(--fog);
        font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
        -webkit-app-region: drag;
      }
      .card { width: 420px; max-width: calc(100vw - 48px); -webkit-app-region: no-drag; }
      h1 { font-size: 22px; margin: 0 0 6px; letter-spacing: -0.02em; }
      p.sub { margin: 0 0 22px; color: var(--slate); }
      label { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--slate); margin-bottom: 8px; }
      input {
        width: 100%;
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px solid #23303f;
        background: #111823;
        color: var(--fog);
        font-size: 15px;
        outline: none;
      }
      input:focus { border-color: var(--indigo); }
      button {
        width: 100%;
        margin-top: 14px;
        padding: 12px 14px;
        border: 0;
        border-radius: 10px;
        background: var(--indigo);
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled { opacity: 0.5; cursor: default; }
      .hint { margin-top: 16px; color: var(--slate); font-size: 12.5px; }
      .hint code { color: #92a2b8; }
      .err { margin-top: 12px; color: #ee3e2d; font-size: 13px; min-height: 18px; }
      .presets { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
      .presets button {
        width: auto; margin: 0; padding: 6px 10px; font-size: 12px; font-weight: 500;
        background: #182130; color: #a9b6c7; border: 1px solid #23303f;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Connect to Tsushin</h1>
      <p class="sub">Point the desktop app at your Tsushin server.</p>
      <label for="server">Server address</label>
      <input id="server" type="text" placeholder="tsushin.archsec.io" autocomplete="off" spellcheck="false" />
      <div class="presets">
        <button type="button" data-url="https://tsushin.archsec.io">Production</button>
        <button type="button" data-url="https://localhost">Local stack</button>
        <button type="button" data-url="http://localhost:3030">Local dev (3030)</button>
      </div>
      <button id="connect" type="button">Connect</button>
      <div class="err" id="err"></div>
      <p class="hint">
        Plain hostnames default to <code>https://</code>. Self-signed certificates are trusted for
        <code>localhost</code> only.
      </p>
    </div>
    <script>
      const input = document.getElementById('server')
      const btn = document.getElementById('connect')
      const err = document.getElementById('err')

      window.tsushinDesktop.getConfig().then((cfg) => {
        if (cfg.serverUrl) input.value = cfg.serverUrl
        input.focus()
        input.select()
      })

      async function connect() {
        err.textContent = ''
        btn.disabled = true
        const res = await window.tsushinDesktop.setServer(input.value)
        if (!res.ok) {
          err.textContent = res.error
          btn.disabled = false
        }
      }

      btn.addEventListener('click', connect)
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') connect()
      })
      for (const preset of document.querySelectorAll('.presets button')) {
        preset.addEventListener('click', () => {
          input.value = preset.dataset.url
          connect()
        })
      }
    </script>
  </body>
</html>
