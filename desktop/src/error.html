<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Tsushin — can't reach server</title>
    <style>
      :root { --ink:#0b0f14; --indigo:#3c5afe; --slate:#5b6674; --fog:#f6f7f9; }
      body {
        margin:0; height:100vh; display:grid; place-items:center;
        background:var(--ink); color:var(--fog);
        font:14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
        -webkit-app-region: drag;
      }
      .card { width:460px; max-width:calc(100vw - 48px); text-align:center; -webkit-app-region:no-drag; }
      h1 { font-size:20px; margin:0 0 8px; letter-spacing:-0.02em; }
      p { color:var(--slate); margin:0 0 6px; }
      code { color:#92a2b8; word-break:break-all; }
      .detail { font-size:12.5px; color:#6b7787; margin-top:10px; }
      .row { display:flex; gap:10px; justify-content:center; margin-top:22px; }
      button { padding:10px 16px; border:0; border-radius:10px; font-size:14px; font-weight:600; cursor:pointer; }
      #retry { background:var(--indigo); color:#fff; }
      #change { background:#182130; color:#a9b6c7; border:1px solid #23303f; font-weight:500; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Can't reach your Tsushin server</h1>
      <p><code id="server"></code></p>
      <p class="detail" id="detail"></p>
      <div class="row">
        <button id="retry" type="button">Retry</button>
        <button id="change" type="button">Change server</button>
      </div>
    </div>
    <script>
      const params = new URLSearchParams(location.search)
      document.getElementById('server').textContent = params.get('server') || ''
      document.getElementById('detail').textContent = params.get('detail') || ''
      document.getElementById('retry').addEventListener('click', () => window.tsushinDesktop.retry())
      document.getElementById('change').addEventListener('click', () => window.tsushinDesktop.openSetup())
    </script>
  </body>
</html>
